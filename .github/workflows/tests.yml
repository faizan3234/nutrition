name: Reliv Nutrition tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python -m scripts.audit_calculations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check admin/app.js
      - run: npm install --prefix "$RUNNER_TEMP/reliv-ui" jsdom@30.1.3 --no-audit --no-fund
      - run: NODE_PATH="$RUNNER_TEMP/reliv-ui/node_modules" node scripts/test_portion_ui.cjs
      - run: python -m scripts.audit_release_gates
