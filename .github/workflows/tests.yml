name: Reliv Nutrition tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python -m scripts.audit_calculations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js

      - run: node --check admin/app.js
      - run: python -m scripts.audit_release_gates
